[project]
name = "agora-backend"
version = "0.1.0"
description = "Agora MerchantHub Backend - FastAPI with AI Catalogue Processing"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # FastAPI & Server
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    # Database & ORM
    "sqlalchemy==2.0.36",
    # Validation & Config
    "pydantic[email]==2.10.5",
    "pydantic-settings==2.7.1",
    # Auth & Security
    "python-jose[cryptography]==3.3.0",
    "passlib==1.7.4",
    "bcrypt==4.1.3",
    # File Upload & Environment
    "python-multipart==0.0.20",
    "python-dotenv==1.0.1",
    # Cloud Storage
    "boto3==1.35.0",
    # AI Agent (Catalogue Processing)
    "langchain==1.2.0",
    "langchain-google-genai==4.1.3",
    "langgraph==1.0.5",
    "pillow==12.1.0",
    "pypdfium2==5.3.0",
    "pytesseract==0.3.13",
    "pyyaml==6.0.2",
    "pandas>=3.0.0",
    "alembic>=1.18.1",
    "protobuf>=4.21.0,<5.0.0",
    "setuptools>=80.9.0",
    "langchain-chroma>=1.1.0",
    "mlflow-skinny>=3.9.0",
    "langgraph-checkpoint-sqlite>=3.0.3",
    "serpapi>=0.1.5",
    "google-search-results>=2.4.2",
]

[project.optional-dependencies]
dev = [
    "ipykernel>=7.1.0",
    "jupyter>=1.1.1",
]

[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "data", "agent"]
