<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#4299e1" />

    <!-- Initialize theme BEFORE React loads -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('agora-theme');
          var theme = 'light';

          if (savedTheme === 'light' || savedTheme === 'dark') {
            theme = savedTheme;
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            theme = 'dark';
          }

          // Remove both possible theme classes first
          document.documentElement.classList.remove('light-theme', 'dark-theme');
          // Add the correct theme class
          document.documentElement.classList.add(theme + '-theme');
        } catch (e) {
          // Silently fail if localStorage is blocked
        }
      })();
    </script>

    <title>Agora MerchantHub - Inventory Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@200;300;400;500;600;700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { margin: 0; font-family: 'Readex Pro', sans-serif; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
