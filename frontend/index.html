<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agora MerchantHub - Inventory Management</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body { margin: 0; font-family: 'Source Sans 3', sans-serif; }
      #auth-screen {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      }
      #auth-box {
        background: white;
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        width: 400px;
        max-width: 90%;
      }
      #auth-box h1 {
        margin: 0 0 10px;
        font-size: 28px;
        color: #1a202c;
      }
      #auth-box p {
        margin: 0 0 30px;
        color: #718096;
        font-size: 14px;
      }
      #auth-box input {
        width: 100%;
        padding: 14px;
        margin-bottom: 16px;
        border: 2px solid #e2e8f0;
        border-radius: 8px;
        font-size: 15px;
        font-family: inherit;
        box-sizing: border-box;
        outline: none;
      }
      #auth-box input:focus {
        border-color: #667eea;
      }
      #auth-box button {
        width: 100%;
        padding: 14px;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        font-weight: 600;
        cursor: pointer;
        font-family: inherit;
      }
      #auth-box button:hover {
        opacity: 0.9;
      }
      #auth-error {
        color: #e53e3e;
        font-size: 14px;
        margin-top: 16px;
        display: none;
      }
      #root { display: none; }
      .authenticated #root { display: block; }
      .authenticated #auth-screen { display: none; }
    </style>
  </head>
  <body>
    <div id="auth-screen">
      <div id="auth-box">
        <h1>🔐 Authentication Required</h1>
        <p>Please enter credentials to access Agora MerchantHub</p>
        <form id="auth-form">
          <input type="text" id="username" placeholder="Username" required autocomplete="username" />
          <input type="password" id="password" placeholder="Password" required autocomplete="current-password" />
          <button type="submit">Sign In</button>
          <div id="auth-error">Invalid credentials. Please try again.</div>
        </form>
      </div>
    </div>
    <div id="root"></div>
    <script>
      // Simple authentication check
      const VALID_CREDENTIALS = {
        'admin': 'password',
        'demo': 'demo123'
      };

      function checkAuth() {
        const authenticated = sessionStorage.getItem('authenticated');
        if (authenticated === 'true') {
          document.body.classList.add('authenticated');
        }
      }

      document.getElementById('auth-form').addEventListener('submit', function(e) {
        e.preventDefault();
        const username = document.getElementById('username').value;
        const password = document.getElementById('password').value;

        if (VALID_CREDENTIALS[username] === password) {
          sessionStorage.setItem('authenticated', 'true');
          document.body.classList.add('authenticated');
          document.getElementById('auth-error').style.display = 'none';
        } else {
          document.getElementById('auth-error').style.display = 'block';
        }
      });

      checkAuth();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
