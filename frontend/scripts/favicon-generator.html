<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Favicon Generator</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 800px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .container {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    h1 { color: #333; margin-top: 0; }
    .preview {
      display: flex;
      gap: 20px;
      margin: 30px 0;
      flex-wrap: wrap;
    }
    .preview-item {
      text-align: center;
    }
    canvas {
      border: 1px solid #ddd;
      border-radius: 4px;
      display: block;
      margin-bottom: 10px;
    }
    button {
      background: #4299e1;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
    }
    button:hover {
      background: #3182ce;
    }
    .instructions {
      background: #f7fafc;
      padding: 15px;
      border-radius: 6px;
      margin-top: 20px;
      font-size: 14px;
      line-height: 1.6;
    }
    .instructions code {
      background: #e2e8f0;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🎨 Agora Favicon Generator</h1>
    <p>Generate PNG favicons from the SVG source</p>

    <div class="preview">
      <div class="preview-item">
        <canvas id="favicon" width="32" height="32"></canvas>
        <button onclick="download('favicon', 'favicon.png')">Download 32×32</button>
      </div>
      <div class="preview-item">
        <canvas id="apple" width="180" height="180"></canvas>
        <button onclick="download('apple', 'apple-touch-icon.png')">Download 180×180</button>
      </div>
    </div>

    <div class="instructions">
      <strong>Instructions:</strong><br>
      1. Click the buttons above to download the PNG files<br>
      2. Save <code>favicon.png</code> and <code>apple-touch-icon.png</code> to <code>frontend/public/</code><br>
      3. The HTML is already updated to reference these files
    </div>
  </div>

  <script>
    const svgSource = `<svg width="32" height="32" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="24" height="24" rx="6" fill="url(#gradient)"/>
  <path d="M6 2L3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z" stroke="white" stroke-width="1.5" fill="none"/>
  <line x1="3" y1="6" x2="21" y2="6" stroke="white" stroke-width="1.5"/>
  <path d="M16 10a4 4 0 0 1-8 0" stroke="white" stroke-width="1.5" fill="none"/>
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="24" y2="24">
      <stop offset="0%" stop-color="#4299e1"/>
      <stop offset="100%" stop-color="#3182ce"/>
    </linearGradient>
  </defs>
</svg>`;

    function renderFavicon(canvasId, size) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');

      const img = new Image();
      const blob = new Blob([svgSource], { type: 'image/svg+xml' });
      const url = URL.createObjectURL(blob);

      img.onload = function() {
        ctx.drawImage(img, 0, 0, size, size);
        URL.revokeObjectURL(url);
      };

      img.src = url;
    }

    function download(canvasId, filename) {
      const canvas = document.getElementById(canvasId);
      canvas.toBlob(function(blob) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        a.click();
        URL.revokeObjectURL(url);
      });
    }

    // Render on page load
    renderFavicon('favicon', 32);
    renderFavicon('apple', 180);
  </script>
</body>
</html>
