<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eggora Background</title>
    <style>
        :root {
            /* Updated to stronger/warmer tones */
            --bg-gradient-start: #ffb6e6; /* Vibrant Pink */
            --bg-gradient-center: #ffecd9; /* Stronger Warm Peach */
            --bg-gradient-end: #9dcaff;   /* Vibrant Blue */
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            width: 100%;
            background-color: #fff9f5; /* Very light warm base */
            
            /* Layered Gradients */
            background-image: 
                /* 1. Strong Warm Peach Center - Pushed to front to define the middle */
                radial-gradient(circle at 50% 50%, var(--bg-gradient-center) 0%, rgba(255, 236, 217, 0) 65%),

                /* 2. Pink bloom from the Left */
                radial-gradient(circle at 0% 50%, var(--bg-gradient-start) 0%, transparent 60%),
                
                /* 3. Blue bloom from the Top-Right */
                radial-gradient(circle at 100% 0%, var(--bg-gradient-end) 0%, transparent 60%);
            
            background-repeat: no-repeat;
            background-attachment: fixed;
            
            /* Center alignment */
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            color: rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>
    <!-- Clean background ready for use -->
</body>
</html>
